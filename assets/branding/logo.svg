<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- amber thread looping through the eye and trailing off -->
  <path
    d="M16 40 C 30 22, 44 30, 52 40 C 58 47, 50 56, 42 52 C 36 49, 40 41, 50 42 C 64 43, 74 54, 82 70"
    stroke="#E0A800" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- needle shaft -->
  <line x1="30" y1="74" x2="66" y2="30" stroke="#fff" stroke-width="4.2" stroke-linecap="round" />
  <!-- needle point highlight -->
  <line x1="62" y1="35" x2="66" y2="30" stroke="#fff" stroke-width="4.2" stroke-linecap="round" />
  <!-- eye of the needle -->
  <ellipse cx="61.5" cy="35.5" rx="3.4" ry="5" transform="rotate(-50 61.5 35.5)" stroke="#fff" stroke-width="2.4" fill="#1F3864" />
</svg>
